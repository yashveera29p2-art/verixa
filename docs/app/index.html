<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href /verixa/app/`. -->
  <base href="/verixa/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="Verixa: build genuine, ATS-friendly resumes, scan resumes for manipulation, and tailor them to companies and job descriptions.">

  <!-- Home-screen app (iPhone: Share → Add to Home Screen). -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Verixa">
  <meta name="theme-color" content="#F5F1E8">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Verixa</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #001F1E; overscroll-behavior: none; }
    /* Shown while the app downloads; matches the app's splash colour. */
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 40%, #002C28, #001F1E 70%);
      transition: opacity 300ms ease-out; z-index: 10;
    }
    #loading img { width: 112px; height: 112px; animation: breathe 1.6s ease-in-out infinite; }
    #loading.done { opacity: 0; pointer-events: none; }
    @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.96); } 50% { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div id="loading"><img src="icons/splash-logo.png" alt="Verixa"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      el.classList.add('done');
      setTimeout(function () { el.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
